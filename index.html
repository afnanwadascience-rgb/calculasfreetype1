<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculas Typing</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/content.js" defer></script>
    <script src="assets/sound.js" defer></script>
    <script src="assets/engine.js" defer></script>
    <script src="assets/app.js" defer></script>
</head>
<body>
    <div id="hero-container">
        <video id="hero-video" autoplay loop muted playsinline>
            <source src="assets/videos/hero.mp4" type="video/mp4">
        </video>
        <div id="hero-overlay">
            <h1>Calculas Typing</h1>
            <button id="start-btn" class="btn">Start Typing</button>
            <button id="sound-toggle-btn" class="btn-icon">🔊</button>
        </div>
    </div>

    <div id="typing-container" class="hidden">
        <div id="mode-selector">
            <button data-mode="standard" class="mode-btn active">Standard</button>
            <button data-mode="numbers" class="mode-btn">Numbers</button>
            <button data-mode="punctuation" class="mode-btn">Punctuation</button>
        </div>

        <div id="stats-bar">
            <div>Time: <span id="timer">30</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
            <div>Accuracy: <span id="accuracy">100</span>%</div>
            <div>Errors: <span id="errors">0</span></div>
        </div>

        <div id="passage-display" class="passage-box"></div>
        <input type="text" id="typing-input" class="typing-input" autocomplete="off" ref="input" />

        <button id="restart-btn" class="btn">Restart</button>
    </div>

    <div id="results-container" class="hidden">
        <h2>Results</h2>
        <p>WPM: <span id="final-wpm">0</span></p>
        <p>Accuracy: <span id="final-accuracy">0</span>%</p>
        <p>Errors: <span id="final-errors">0</span></p>
        <button id="results-restart-btn" class="btn">Try Again</button>
    </div>
</body>
</html>
